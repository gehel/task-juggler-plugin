name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # TaskJuggler itself: its examples and tj3 binary are used by the parser, inspection and tj3 tests.
      - name: Install TaskJuggler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tj3

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: build/distributions/*.zip

  verify:
    name: Plugin verifier
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Run plugin verifier
        run: ./gradlew verifyPlugin

      - name: Upload verifier reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verifier-reports
          path: build/reports/pluginVerifier

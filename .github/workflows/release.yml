name: Release

# Publishing a GitHub release tagged vX.Y.Z builds, tests, signs and publishes version X.Y.Z
# to the JetBrains Marketplace, and attaches the plugin zip to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
      CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Install TaskJuggler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tj3

      - name: Plugin version from tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "Release tag must look like v1.2.3, got '$TAG'" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build -PpluginVersion=${{ steps.version.outputs.version }}

      - name: Publish to JetBrains Marketplace
        run: ./gradlew publishPlugin -PpluginVersion=${{ steps.version.outputs.version }}

      - name: Attach plugin to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/distributions/*.zip --clobber
